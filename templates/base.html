<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Prospecte OS{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS compartilhado -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/base.css') }}"
    >
    {% block page_styles %}{% endblock %}

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/responsive.css') }}"
    >

</head>

<body>

    <div class="layout">

        <button
            id="mobileSidebarToggle"
            type="button"
            class="mobile-sidebar-toggle"
            aria-label="Abrir menu"
        >
            <i class="bi bi-list"></i>
        </button>

        {% include "components/sidebar.html" %}

        <main class="main">

            {% block content %}{% endblock %}

        </main>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const sidebar = document.getElementById("mainSidebar");
            const toggle = document.getElementById("sidebarToggle");
            const mobileToggle = document.getElementById("mobileSidebarToggle");
            const brand = sidebar ? sidebar.querySelector(".brand") : null;

            if (!sidebar || !toggle) return;

            toggle.addEventListener("click", function () {
                if (window.matchMedia("(max-width: 800px)").matches) {
                    document.body.classList.toggle("sidebar-mobile-open");
                    return;
                }

                document.body.classList.toggle("sidebar-collapsed");
            });

            if (mobileToggle) {
                mobileToggle.addEventListener("click", function () {
                    document.body.classList.toggle("sidebar-mobile-open");
                });
            }

            if (brand) {
                brand.addEventListener("click", function (event) {
                    if (!window.matchMedia("(max-width: 800px)").matches && document.body.classList.contains("sidebar-collapsed")) {
                        event.preventDefault();
                        document.body.classList.remove("sidebar-collapsed");
                    }
                });
            }

            document.querySelectorAll(".menu-item").forEach(function (item) {
                item.addEventListener("click", function () {
                    if (window.matchMedia("(max-width: 800px)").matches) {
                        document.body.classList.remove("sidebar-mobile-open");
                    }
                });
            });

        });

    </script>

    {% block page_scripts %}{% endblock %}

</body>

</html>
